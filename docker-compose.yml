services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-pulse-rf-local-install-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      HOST: 0.0.0.0
      PORT: "8080"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pulse-db:
