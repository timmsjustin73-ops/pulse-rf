services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    image: ghcr.io/timmsjustin73-ops/pulse-rf:latest
    build: .
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pulserf.rule=Host(`rf.jtlive.tech`)"
      - "traefik.http.routers.pulserf.entrypoints=websecure"
      - "traefik.http.routers.pulserf.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pulserf-http.rule=Host(`rf.jtlive.tech`)"
      - "traefik.http.routers.pulserf-http.entrypoints=web"
      - "traefik.http.routers.pulserf-http.middlewares=pulserf-redirect"
      - "traefik.http.middlewares.pulserf-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.pulserf-redirect.redirectscheme.permanent=true"
      - "traefik.http.services.pulserf.loadbalancer.server.port=8080"
    environment:
      DATABASE_URL: postgres://pulse:pulse@db:5432/pulse
      PULSE_ADMIN_EMAIL: ${PULSE_ADMIN_EMAIL:-justin@jtlive.tech}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-rf@jtlive.tech}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-pulse-rf-local-install-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://rf.jtlive.tech:8080}
      HOST: 0.0.0.0
      PORT: "8080"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pulse-db:
